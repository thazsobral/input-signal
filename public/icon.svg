<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background base rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Oscilloscope Grid Lines -->
  <g opacity="0.18" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 6">
    <line x1="80" y1="170" x2="432" y2="170" />
    <line x1="80" y1="256" x2="432" y2="256" />
    <line x1="80" y1="342" x2="432" y2="342" />
    <line x1="168" y1="90" x2="168" y2="422" />
    <line x1="256" y1="90" x2="256" y2="422" />
    <line x1="344" y1="90" x2="344" y2="422" />
  </g>

  <!-- Keycap base / switch frame -->
  <rect x="116" y="128" width="280" height="256" rx="28" fill="#1e293b" stroke="#334155" stroke-width="6" />
  <rect x="136" y="148" width="240" height="216" rx="20" fill="#0f172a" />

  <!-- Signal wave / Chattering pulse visualization -->
  <path d="M 148 256 L 190 256 L 204 196 L 216 296 L 226 210 L 236 270 L 246 230 L 256 256 L 310 256 L 330 180 L 344 320 L 358 256 L 364 256"
        fill="none" stroke="url(#cyanGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Precision Contact Points -->
  <circle cx="204" cy="196" r="6" fill="#38bdf8" />
  <circle cx="330" cy="180" r="7" fill="#10b981" />
  <circle cx="344" cy="320" r="7" fill="#f43f5e" />

  <!-- Bottom status pill -->
  <rect x="186" y="388" width="140" height="24" rx="12" fill="#10b981" opacity="0.9" />
  <circle cx="202" cy="400" r="4" fill="#ffffff" />
  <text x="216" y="405" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">RAW INPUT</text>
</svg>
